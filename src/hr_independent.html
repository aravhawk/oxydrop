<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera heart rate</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 1.5rem auto; padding: 0 1rem; max-width: 34rem; }
  h1 { line-height: 1.1; }
  video { display: block; width: 100%; max-height: 14rem; background: #171717; border-radius: .5rem; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-block: 1rem; }
  button, select { font: inherit; padding: .5rem; }
  select { max-width: 100%; }
  output { display: block; font-size: 1.5rem; font-weight: 650; }
  small { display: block; }
</style>
<main>
  <h1>Camera heart rate</h1>
  <p>Cover the rear lens closest to the flash with your fingertip. Hold still, then select Measure.</p>
  <video id="preview" muted playsinline aria-label="Camera preview"></video>
  <div class="controls">
    <label for="camera">Camera</label>
    <select id="camera" disabled><option value="">Automatic rear camera</option></select>
    <label><input id="torch" type="checkbox" checked> Torch</label>
  </div>
  <div class="controls">
    <button id="enable">Enable camera</button>
    <button id="measure" disabled>Measure</button>
    <button id="stop" disabled>Stop camera</button>
  </div>
  <p id="status" role="status"></p>
  <output id="result" aria-live="polite"></output>
  <small id="settings"></small>
</main>
<script type="module" src="./hr_independent_camera.js"></script>
</html>
